name: Project screenshots

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Retake every screenshot (otherwise only missing ones)"
        type: boolean
        default: false
  push:
    paths:
      - assets/js/projects.js
      - scripts/screenshot.mjs
      - .github/workflows/screenshots.yml

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Take screenshots
        run: node scripts/screenshot.mjs
        env:
          REFRESH: ${{ inputs.refresh }}

      - name: Commit new screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/projects
          if git diff --cached --quiet; then
            echo "No screenshot changes"
            exit 0
          fi
          git commit -m "Update project screenshots"
          git push
